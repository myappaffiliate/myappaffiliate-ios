# Managed by the monorepo — edit distribution/mirrors/ there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -v
      - run: swift test -v
      # SwiftPM resolves this repo by tag, so the build a customer performs is
      # the one that matters: iOS, not the macOS host.
      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme MyAppAffiliate \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
